[project]
name = "stn-api"
version = "0.3.0"
description = "Non-live STN API: clinician sign-in, review workflow and audit (synthetic data only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyJWT[crypto]>=2.9,<3",
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.package-data]
app = ["migrations/*/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
