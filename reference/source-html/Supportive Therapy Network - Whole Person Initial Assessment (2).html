<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supportive Therapy Network — Whole Person Initial Assessment</title>
<meta name="description" content="Supportive Therapy Network's digital whole person initial assessment and DSM-5 diagnostic checklist prototype — wraparound screening, validated clinical instruments and stepped-care allocation.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="Supportive Therapy Network — Whole Person Initial Assessment">
<meta property="og:description" content="Digital whole person initial assessment and diagnostic checklist prototype, built on validated clinical instruments.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#08070A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#AF2CFF;
    --purple-dim: #7c1fc9;
    --purple-glow: rgba(175,44,255,0.16);
    --bg:#08070A;
    --panel:#121016;
    --panel-2:#17141C;
    --line: rgba(255,255,255,0.10);
    --ink:#F3F1F6;
    --ink-dim: #A7A2B3;
    --ink-faint:#716C7C;
    --red:#FF4D5E;
    --red-glow: rgba(255,77,94,0.14);
    --amber:#F5B942;
    --green:#3ED598;
    --radius: 14px;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#08070A; --ink:#F3F1F6;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(120% 140% at 15% -10%, #1c1225 0%, var(--bg) 55%);
    color:var(--ink);
    font-family: var(--sans);
    min-height:100vh;
    line-height:1.5;
  }
  .shell{
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 90px;
  }
  header.top{
    display:flex; align-items:center; gap:12px;
    margin-bottom: 30px;
  }
  .brainmark{ flex:none; }
  .brand{
    display:flex; flex-direction:column; line-height:1.15;
  }
  .brainmark-full{ height:40px; width:auto; display:block; }
  .hero-logo{ display:block; height:110px; width:auto; margin:0 auto 18px; }
  .progress-wrap{
    position: sticky; top:0; z-index:5;
    background: linear-gradient(to bottom, var(--bg) 70%, transparent);
    padding: 10px 0 16px;
    margin: -10px 0 20px;
  }
  .progress-track{
    height:3px; background: var(--line); border-radius:3px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background: linear-gradient(90deg, var(--purple-dim), var(--purple));
    transition: width .35s ease;
  }
  .progress-label{
    font-size:11px; color:var(--ink-faint); margin-top:8px;
    display:flex; justify-content:space-between;
  }
  .card{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 24px;
    margin-bottom:16px;
  }
  .eyebrow{ font-size:12.5px; color:var(--purple); font-weight:700; margin-bottom:6px; }
  h1.hero{
    font-family: var(--serif);
    font-weight:600;
    font-size: 32px;
    line-height:1.18;
    margin: 4px 0 14px;
  }
  h2.module-title{
    font-family: var(--serif);
    font-weight:600;
    font-size:23px;
    margin: 0 0 4px;
  }
  p.lede{ color: var(--ink-dim); font-size:15px; margin: 0 0 18px; max-width:60ch; }
  p.small{ font-size:13px; color:var(--ink-faint); }
  .instrument-tag{
    display:inline-block; font-size:11.5px; color:var(--ink-dim);
    border:1px solid var(--line); padding:3px 10px; border-radius:20px;
    margin-bottom:14px;
  }
  .license-note{
    font-size:12.5px; color: var(--amber); background: rgba(245,185,66,0.08);
    border:1px solid rgba(245,185,66,0.25); padding:8px 12px; border-radius:10px;
    margin-bottom:16px;
  }
  .question{
    padding:18px 0; border-top:1px solid var(--line);
  }
  .question:first-of-type{ border-top:none; padding-top:4px; }
  .qtext{ font-size:15.5px; margin-bottom:12px; }
  .options{ display:flex; flex-direction:column; gap:8px; }
  .opt{
    display:flex; align-items:center; gap:11px;
    padding:11px 14px; border-radius:10px;
    border:1px solid var(--line);
    background: var(--panel-2);
    cursor:pointer;
    transition: border-color .15s, background .15s;
    font-size:14.5px;
  }
  .opt:hover{ border-color: rgba(175,44,255,0.4); }
  .opt.selected{
    border-color: var(--purple);
    background: var(--purple-glow);
  }
  .opt input{ accent-color: var(--purple); width:16px; height:16px; flex:none; }
  .yn-row{ display:flex; gap:10px; }
  .yn-row .opt{ flex:1; justify-content:center; }
  .safety-q{
    border:1px solid rgba(255,77,94,0.35);
    background: var(--red-glow);
    border-radius:12px; padding:16px;
    margin: 6px 0 16px;
  }
  .safety-q .qtext{ font-weight:600; }
  .actions{
    display:flex; justify-content:space-between; align-items:center;
    margin-top: 22px; gap:12px;
  }
  button{
    font-family: var(--sans); font-weight:700; font-size:14.5px;
    border-radius: 10px; border:none; cursor:pointer;
    padding: 13px 22px;
    transition: transform .1s, opacity .15s, background .15s;
  }
  button:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--purple); color:#0A0510; }
  .btn-primary:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-primary:not(:disabled):hover{ background:#c14dff; }
  .btn-ghost{
    background:transparent; color:var(--ink-dim); border:1px solid var(--line);
  }
  .btn-ghost:hover{ color:var(--ink); border-color: var(--ink-dim); }
  .btn-crisis{ background: var(--red); color:#fff; width:100%; }
  .btn-crisis:hover{ background:#ff6675; }
  a.link{ color: var(--purple); }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  footer.disclaimer{
    font-size:11.5px; color: var(--ink-faint); text-align:center; margin-top:34px; padding: 0 10px;
  }
  /* results */
  .result-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:16px; padding:16px 0; border-top:1px solid var(--line);
  }
  .result-row:first-child{ border-top:none; }
  .result-name{ font-weight:700; font-size:14.5px; }
  .result-instrument{ font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .result-band{ text-align:right; font-size:14px; font-weight:600; max-width: 46%; }
  .badge{
    display:inline-block; font-size:11px; font-weight:800; padding:3px 9px;
    border-radius:20px; margin-left:8px; vertical-align:middle;
  }
  .badge-red{ background: rgba(255,77,94,0.18); color:var(--red); }
  .badge-green{ background: rgba(62,213,152,0.15); color:var(--green); }
  .badge-amber{ background: rgba(245,185,66,0.16); color:var(--amber); }
  .allocation-step{
    font-family: var(--serif); font-size:30px; font-weight:600; color:var(--purple);
    margin: 2px 0 2px;
  }
  .reason-list{ margin:14px 0 0; padding-left:18px; font-size:14px; color:var(--ink-dim); }
  .reason-list li{ margin-bottom:7px; }
  .gap-note{
    font-size:13px; color:var(--amber); background:rgba(245,185,66,0.07);
    border:1px solid rgba(245,185,66,0.2); border-radius:10px; padding:10px 12px; margin-top:12px;
  }
  .crisis-box{
    border:1px solid rgba(255,77,94,0.4); background: var(--red-glow);
    border-radius: var(--radius); padding:22px; margin-bottom:16px;
  }
  .crisis-box h1{ color: var(--red); font-family:var(--serif); margin:6px 0 12px; font-size:26px;}
  .resource{
    display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid rgba(255,255,255,0.08);
    font-size:14.5px;
  }
  .resource:first-of-type{ border-top:none; }
  .resource b{ color:var(--ink); }
  .checklist{ margin-top: 8px; }
  .flag-item{ font-size:13.5px; color:var(--ink-dim); padding:8px 0; border-top:1px solid var(--line); }
  .flag-item:first-child{ border-top:none; }
  code.pill{
    font-family: var(--sans); font-size:11.5px; background:var(--panel-2); border:1px solid var(--line);
    padding:2px 8px; border-radius: 8px; color:var(--ink-dim);
  }
  ::selection{ background: var(--purple-glow); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

const clampToScale = (raw, scaleLength) => {
  const n = Number(raw);
  if (!Number.isFinite(n)) return 0;
  return Math.min(scaleLength - 1, Math.max(0, Math.round(n)));
};
const scaleFor = (module, q) => q.scale || module.scale;
function bandFor(module, total){
  for (const [min,max,label] of module.bands || []) if (total>=min && total<=max) return label;
  return 'Score outside expected range — review manually';
}
function scoreModule(module, answerMap={}){
  if (module.mode === 'cssrs') throw new Error('Use classifyCssrs() for the C-SSRS.');
  const itemScores=[]; const safetyItems=[]; let total=0; let secondary=null;
  const scored = module.questions.filter(q=>!q.safety);
  if (module.mode === 'countAboveThreshold'){
    let raw=0;
    for (const q of scored){
      const value = clampToScale(answerMap[q.id], scaleFor(module,q).length);
      const threshold = q.threshold ?? scaleFor(module,q).length-1;
      const positive = value >= threshold;
      if (positive) total += 1;
      raw += value;
      itemScores.push({questionId:q.id, value, screenPositive:positive, threshold});
    }
    secondary = {label:'Raw summed score (0-24; 14+ is an alternative published cutpoint)', value:raw};
  } else {
    for (const q of scored){
      const scale = scaleFor(module,q);
      const value = clampToScale(answerMap[q.id], scale.length);
      const adjusted = q.reverse ? scale.length-1-value : value;
      const withOffset = adjusted + (module.offset||0);
      total += withOffset;
      itemScores.push({questionId:q.id, value, scored:withOffset, reverse: !!q.reverse});
    }
  }
  for (const q of module.questions.filter(q=>q.safety)){
    const value = clampToScale(answerMap[q.id], scaleFor(module,q).length);
    if (value>=1) safetyItems.push({questionId:q.id, value});
    itemScores.push({questionId:q.id, value, safety:true});
  }
  const safetyFlag = safetyItems.length>0;
  const max = module.mode==='countAboveThreshold' ? scored.length
    : scored.reduce((s,q)=> s + (scaleFor(module,q).length-1) + (module.offset||0), 0);
  return {
    moduleId:module.id, moduleName:module.name, instrument:module.instrument,
    total, max, band: bandFor(module,total), secondary, safetyFlag, safetyItems,
    riskLevel: safetyFlag ? 'RED':'GREEN', itemScores,
    interpretation: safetyFlag
      ? 'SAFETY ITEM ENDORSED. Immediate safety response required. Complete the C-SSRS now. The symptom score must not delay human assessment.'
      : `${bandFor(module,total)}. Screening result only — interpret with history, functional impact, cultural context and clinical judgement.`,
  };
}
function classifyCssrs(answers={}){
  const yes = id => answers[id]===true || answers[id]===1 || answers[id]==='yes';
  const feelsSafe = answers.cssrs_7===true || answers.cssrs_7===1 || answers.cssrs_7==='yes';
  let level;
  if (yes('cssrs_5') || yes('cssrs_6') || !feelsSafe) level='crisis';
  else if (yes('cssrs_4')) level='high';
  else if (yes('cssrs_2') || yes('cssrs_3')) level='moderate';
  else level='low';
  const action = {
    crisis:'CRISIS — follow the Safety Response Protocol now. Do not continue the assessment. Escalate immediately.',
    high:'HIGH — follow the Safety Response Protocol now. Contact the on-call clinician.',
    moderate:'MODERATE — same-day clinician review. Document a safety plan.',
    low:'LOW — continue assessment. Document the result.',
  }[level];
  return { riskLevel:level, requiresImmediateEscalation: level==='crisis'||level==='high', action, answers };
}
const STEPS = [
  {code:'STEP 1', title:'Self-management & community support', target:'Within 4 weeks'},
  {code:'STEP 2', title:'Guided self-help / brief intervention', target:'Within 2 weeks'},
  {code:'STEP 3', title:'Structured psychological therapy', target:'Within 1 week'},
  {code:'STEP 4', title:'Specialist / complex care + case management', target:'Within 48 hours'},
  {code:'STEP 5', title:'Acute crisis response', target:'Immediate — same session'},
];
function finalise(idx, reasons, dataGaps, socialCount){
  const step = STEPS[idx];
  const referrals = [
    ['Digital self-help programme','Community/whānau supports','Reassess in 90 days'],
    ['Brief intervention (4-6 sessions)','Psychoeducation','Reassess at session 4'],
    ['Structured therapy with registered clinician','Outcome measures repeated at sessions 4 and 8'],
    ['Specialist psychological input','Case management','Consider psychiatric review','GP notification'],
    ['Crisis service','Emergency clinician review'],
  ][idx].slice();
  if (socialCount>0) referrals.push('Wraparound referrals as identified at intake');
  return { recommendedStep:step.code, stepTitle:step.title, responseTarget:step.target, reasons, referrals, dataGaps,
    requiresClinicianDecision:true,
    note:'Recommendation only. STN does not hold referral authority into agency-controlled services. A registered clinician must accept or override, and record the reason.' };
}
function allocateCare({symptomSeverity=0, functionalImpairment=null, riskLevel=null, socialComplexityCount=0, chronic=false}={}){
  const reasons=[]; const gaps=[];
  if (riskLevel==='crisis') return finalise(4, ['Safety screening returned CRISIS — overrides all other factors.'], [], socialComplexityCount);
  if (riskLevel==='high') return finalise(3, ['Safety screening returned HIGH — raised to specialist level regardless of symptom scores.'], [], socialComplexityCount);
  if (riskLevel===null) gaps.push('C-SSRS not completed — allocation cannot be considered final.');
  let idx = Math.min(3, Math.max(0, symptomSeverity<=1 ? 0 : symptomSeverity-1));
  reasons.push(`Symptom severity band ${symptomSeverity}/4 sets a baseline of ${STEPS[idx].code}.`);
  if (functionalImpairment===null){
    gaps.push('WHODAS 2.0 not administered — allocation rests on symptoms alone, which under-detects people coping poorly with moderate symptoms.');
  } else {
    const fnIdx = Math.min(3, Math.max(0, functionalImpairment<=1 ? 0 : functionalImpairment-1));
    if (fnIdx>idx){ reasons.push(`Functional impairment (band ${functionalImpairment}/4) exceeds what symptoms alone suggest — raised to ${STEPS[fnIdx].code}. This is the case symptom scales routinely miss.`); idx=fnIdx; }
    else reasons.push(`Functional impairment (band ${functionalImpairment}/4) is consistent with the symptom-based step.`);
  }
  if (socialComplexityCount>=3 && idx<3){ reasons.push(`${socialComplexityCount} concurrent social needs — raised to Step 4, because therapy will not hold while housing, food or financial instability continues.`); idx=3; }
  else if (socialComplexityCount>0) reasons.push(`${socialComplexityCount} social need(s) identified — wraparound referrals added alongside the clinical pathway.`);
  if (chronic && idx<3){ idx+=1; reasons.push(`Duration beyond six months — raised one step to ${STEPS[idx].code}; brief intervention is less likely to suffice for chronic presentations.`); }
  if (riskLevel==='moderate' && idx<2){ idx=2; reasons.push('Safety screening returned MODERATE — minimum of Step 3 with a documented safety plan.'); }
  return finalise(idx, reasons, gaps, socialComplexityCount);
}
function socialComplexityFrom(wrapAnswers={}){
  const socialIds = wraparoundItems.filter(i=>i.domain==='social' && !i.protective).map(i=>i.id);
  let count = socialIds.filter(id => wrapAnswers[id]===true).length;
  if (wrapAnswers.wrap_support_network===false) count += 1;
  return count;
}
function severityBandIndex(instrumentId, total){
  const module = assessmentCatalog.find(m=>m.id===instrumentId);
  if (!module) return 0;
  const i = (module.bands||[]).findIndex(([min,max])=> total>=min && total<=max);
  if (i<0) return 0;
  const n = module.bands.length;
  return Math.round((i/Math.max(1,n-1))*4);
}

function scoreDiagnostic(mod, answers={}){
  const yes = id => answers[id] === 1;
  if (mod.isCountBased){
    const items = mod.groups[0].items;
    const count = items.filter(i=>yes(i.id)).length;
    let severity = 'No disorder indicated (0-1 criteria)';
    if (count>=2 && count<=3) severity='Mild (2-3 criteria)';
    else if (count>=4 && count<=5) severity='Moderate (4-5 criteria)';
    else if (count>=6) severity='Severe (6+ criteria)';
    return { moduleId:mod.id, isCountBased:true, count, max:items.length, severity, met: count>=2 };
  }
  const requiredGatesOk = (mod.requiredGates||[]).every(g=>yes(g.id));
  let totalCount = 0;
  const groupResults = (mod.groups||[]).map(g=>{
    const c = g.items.filter(i=>yes(i.id)).length;
    totalCount += c;
    const ok = g.minRequired ? c>=g.minRequired : true;
    return { id:g.id, label:g.label, count:c, minRequired:g.minRequired||null, ok };
  });
  const groupsOk = mod.groupLogic==='OR' ? groupResults.some(g=>g.ok) : groupResults.every(g=>g.ok);
  const overallOk = mod.overallThreshold ? totalCount>=mod.overallThreshold : true;
  const durationOk = mod.durationGate ? yes(mod.durationGate.id) : true;
  const impairmentOk = mod.impairmentGate ? yes(mod.impairmentGate.id) : true;
  const exclusionFlags = (mod.exclusionGates||[]).filter(e=>yes(e.id));
  const met = requiredGatesOk && groupsOk && overallOk && durationOk && impairmentOk && exclusionFlags.length===0;
  const subthreshold = !met && totalCount>0 && exclusionFlags.length===0;
  return { moduleId:mod.id, isCountBased:false, requiredGatesOk, groupResults, totalCount, overallOk, durationOk, impairmentOk, exclusionFlags, met, subthreshold };
}

async function initCapabilities(){
  try {
    if (window.claude && window.claude.use){
      const [db, user, downloads] = await Promise.all([
        window.claude.use('db').catch(()=>null),
        window.claude.use('user').catch(()=>null),
        window.claude.use('downloads').catch(()=>null),
      ]);
      state.caps.db = db; state.caps.user = user; state.caps.downloads = downloads;
      if (user){ state.caps.isOwner = await user.isOwner().catch(()=>false); }
    }
  } catch(e) { /* capabilities unavailable in this view — degrade silently */ }
  state.caps.ready = true;
  render();
}

async function persistDoc(collectionPath, data){
  if (!state.caps.db) return null;
  try {
    const ref = await state.caps.db.collection(collectionPath).add(data);
    return ref;
  } catch(e) { console.warn('STN persist failed:', collectionPath, e); return null; }
}

function buildQueueAfterCore(){
  const a = state.answers.core_intake || {};
  const v = id => clampToScale(a[id], 4);
  const routes = new Set();
  if (v('core_intake_mood')>=2 || v('core_intake_pleasure')>=2) routes.add('phq9');
  if (v('core_intake_anxiety')>=2 || v('core_intake_worry')>=2 || v('core_intake_worry_control')>=2) routes.add('gad7');
  if (v('core_intake_attention')>=2) routes.add('asrs_a');
  const q = [...routes];
  const w = state.wrapAnswers;
  if (w.wrap_trauma_history===true || w.wrap_trauma_ongoing===true) q.push('pcl5');
  q.push('audit_c');
  if (w.wrap_substance_cope===true || w.wrap_substance_problems===true) q.push('dast10');
  q.push('k10');
  q.push('whodas12');
  return q;
}

function allAnswered(module){
  const a = state.answers[module.id] || {};
  if (module.id==='cssrs'){
    for (const q of module.questions){
      if (q.dependsOn){
        const parentYes = a[q.dependsOn]===1;
        if (!parentYes) continue; // not required if parent not endorsed
      }
      if (a[q.id]===undefined) return false;
    }
    return true;
  }
  return module.questions.every(q => a[q.id] !== undefined);
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(header());
  const barScreens = ['wrap','module','safety-note','results'];
  if (barScreens.includes(state.screen)) app.appendChild(progressBar());
  if (['diag-select','diag-module','diag-results'].includes(state.screen)) app.appendChild(diagProgressBar());

  if (state.screen==='home') app.appendChild(screenHome());
  else if (state.screen==='wrap') app.appendChild(screenWrap());
  else if (state.screen==='module') app.appendChild(screenModule());
  else if (state.screen==='safety-note') app.appendChild(screenSafetyNote());
  else if (state.screen==='crisis') app.appendChild(screenCrisis());
  else if (state.screen==='results') app.appendChild(screenResults());
  else if (state.screen==='diag-select') app.appendChild(screenDiagSelect());
  else if (state.screen==='diag-module') app.appendChild(screenDiagModule());
  else if (state.screen==='diag-results') app.appendChild(screenDiagResults());
  else if (state.screen==='dashboard') app.appendChild(screenDashboard());

  app.appendChild(footerDisclaimer());
}

const TOTAL_STEPS_ESTIMATE = 6; // wrap, core, cssrs, routed batch, audit/whodas, results
function stepIndexEstimate(){
  const order = ['wrap','core_intake','cssrs','routed','results'];
  if (state.screen==='wrap') return 1;
  if (state.screen==='module' && state.currentModuleId==='core_intake') return 2;
  if (state.screen==='module' && state.currentModuleId==='cssrs') return 3;
  if (state.screen==='module') return 4;
  if (state.screen==='safety-note') return 4;
  if (state.screen==='results') return 5;
  return 0;
}
function progressBar(){
  const wrap = document.createElement('div');
  wrap.className = 'progress-wrap';
  const pct = Math.min(100, Math.round((stepIndexEstimate()/5)*100));
  wrap.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label"><span>Whole Person Initial Assessment</span><span>${pct}%</span></div>
  `;
  return wrap;
}
function diagProgressBar(){
  const total = Math.max(1, state.diagSelected.length);
  const done = total - (state.diagQueue.length + (state.diagCurrentId ? 1 : 0));
  const pct = state.screen==='diag-results' ? 100 : Math.min(100, Math.round((Math.max(0,done)/total)*100));
  const wrap = document.createElement('div');
  wrap.className = 'progress-wrap';
  wrap.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label"><span>Diagnostic Assessment</span><span>${pct}%</span></div>
  `;
  return wrap;
}
