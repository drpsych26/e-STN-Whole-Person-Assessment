name: STN Android APK build

# REVIEW CHANGE (2026-11-19): automatic release on push to main removed.
# The APK is a controlled-testing build, is not production-signed, and this
# repository is public. Releases are created manually and as DRAFTS only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true

      - name: Restore and verify original Flutter v4 source
        shell: bash
        run: |
          set -euo pipefail
          part_dir=flutter/source-archives/parts
          mkdir -p /tmp/stn-v4 flutter/source
          cat "$part_dir/part1.txt" "$part_dir/part2.txt" "$part_dir/part4.txt" > /tmp/stn-v4/source.b64
          test "$(wc -c < /tmp/stn-v4/source.b64)" -eq 18404
          base64 --decode /tmp/stn-v4/source.b64 > /tmp/stn-v4/source.zip
          echo "4478e3e54131fdb94db943524a7aa00cef9239122e572eaad6d9e0d5ad95261c  /tmp/stn-v4/source.zip" | sha256sum --check
          unzip -q /tmp/stn-v4/source.zip -d flutter/source

      - name: Generate Android platform and apply maintained STN changes
        working-directory: flutter/source/supportive_therapy_network_v4
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android .
          patch_root="../../../implementation-patches/flutter-v4"
          cp "$patch_root/lib/main.dart" lib/main.dart
          cp "$patch_root/lib/logic/scoring_engine.dart" lib/logic/scoring_engine.dart
          cp "$patch_root/lib/logic/report_builder.dart" lib/logic/report_builder.dart
          cp "$patch_root/lib/storage/secure_hive.dart" lib/storage/secure_hive.dart
          cp "$patch_root/lib/screens/home_screen.dart" lib/screens/home_screen.dart
          cp "$patch_root/lib/screens/whole_person_initial_assessment_screen.dart" lib/screens/whole_person_initial_assessment_screen.dart
          cp "$patch_root/lib/models/core_intake.dart" lib/models/core_intake.dart
          cp "$patch_root/lib/screens/module_screen.dart" lib/screens/module_screen.dart
          cp "$patch_root/lib/screens/results_screen.dart" lib/screens/results_screen.dart
          cp "$patch_root/lib/screens/profiles_screen.dart" lib/screens/profiles_screen.dart
          cp "$patch_root/lib/screens/result_detail_screen.dart" lib/screens/result_detail_screen.dart
          cp "$patch_root/test/scoring_engine_test.dart" test/scoring_engine_test.dart
          cp "$patch_root/test/whole_person_intake_rules_test.dart" test/whole_person_intake_rules_test.dart
          cp "$patch_root/test/widget_test.dart" test/widget_test.dart

      - name: Apply STN brand fonts and logo asset
        working-directory: flutter/source/supportive_therapy_network_v4
        shell: bash
        run: |
          set -euo pipefail
          patch_root="../../../implementation-patches/flutter-v4"
          mkdir -p assets/brand assets/fonts
          cp "$patch_root/assets/brand/stn-logo-original.png" assets/brand/
          cp "$patch_root/assets/fonts/"*.ttf assets/fonts/
          cp "$patch_root/assets/fonts/"OFL-*.txt assets/fonts/
          python3 - "$patch_root/brand-pubspec-fonts.yaml" <<'PY'
          import re, sys
          path = "pubspec.yaml"
          text = open(path).read()
          # flutter: must be the last top-level key so the fragment can be appended under it.
          top = [l for l in text.splitlines() if re.match(r"^[A-Za-z_]+:", l)]
          assert top and top[-1] == "flutter:", f"flutter: is not the last top-level key: {top[-1:]}"
          open(path, "a").write("\n" + open(sys.argv[1]).read())
          PY
          test -s assets/brand/stn-logo-original.png
          test "$(ls assets/fonts/*.ttf | wc -l)" -eq 8

      - name: Apply STN Android identity, launcher icon and signing config
        working-directory: flutter/source/supportive_therapy_network_v4
        shell: bash
        run: |
          set -euo pipefail
          # App ID network.supportivetherapy.app, label "STN", STN launcher
          # icon, and release signing read from android/key.properties.
          cp -R ../../../implementation-patches/flutter-v4/android/. android/
          rm -rf android/app/src/main/kotlin/com/example
          if grep -rq "com.example" android/app/build.gradle.kts android/app/src/main; then
            echo "Placeholder com.example identifiers remain" >&2
            exit 1
          fi

      - name: Configure STN release signing key
        working-directory: flutter/source/supportive_therapy_network_v4
        shell: bash
        env:
          STN_ANDROID_KEYSTORE_BASE64: ${{ secrets.STN_ANDROID_KEYSTORE_BASE64 }}
          STN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STN_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${STN_ANDROID_KEYSTORE_BASE64}" ] || [ -z "${STN_ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "STN signing secrets are not set (STN_ANDROID_KEYSTORE_BASE64, STN_ANDROID_KEYSTORE_PASSWORD)." >&2
            echo "Refusing to build: the APK must be signed with the STN key, never the debug key." >&2
            exit 1
          fi
          keystore="${RUNNER_TEMP}/stn-upload-keystore.p12"
          printf '%s' "${STN_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          umask 077
          {
            echo "storePassword=${STN_ANDROID_KEYSTORE_PASSWORD}"
            echo "keyPassword=${STN_ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=stn-upload"
            echo "storeFile=${keystore}"
          } > android/key.properties

      - name: Resolve dependencies
        working-directory: flutter/source/supportive_therapy_network_v4
        run: flutter pub get

      - name: Format source
        working-directory: flutter/source/supportive_therapy_network_v4
        run: dart format lib test

      - name: Static analysis
        working-directory: flutter/source/supportive_therapy_network_v4
        run: flutter analyze

      - name: Unit and widget tests
        working-directory: flutter/source/supportive_therapy_network_v4
        run: flutter test --reporter expanded

      - name: Build Android release APK
        working-directory: flutter/source/supportive_therapy_network_v4
        run: flutter build apk --release

      - name: Verify APK output
        working-directory: flutter/source/supportive_therapy_network_v4
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          file "$apk"
          sha256sum "$apk"
          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          # Must be signed by the STN upload key (certificate SHA-256 pinned).
          expected="6c5b57ada0570b2a34c83711e527ca673d09534e481be0adb62e01c3342d6bb7"
          "$build_tools/apksigner" verify --print-certs "$apk" | tee /tmp/apk-certs.txt
          grep -q "Signer #1 certificate SHA-256 digest: ${expected}" /tmp/apk-certs.txt
          "$build_tools/aapt" dump badging "$apk" | grep -q "package: name='network.supportivetherapy.app'"

      - name: Remove signing material from runner
        if: always()
        working-directory: flutter/source/supportive_therapy_network_v4
        run: rm -f android/key.properties "${RUNNER_TEMP}/stn-upload-keystore.p12"

      - name: Publish installable APK as a controlled testing release asset
        working-directory: flutter/source/supportive_therapy_network_v4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="stn-android-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" build/app/outputs/flutter-apk/app-release.apk \
            --draft \
            --repo "$GITHUB_REPOSITORY" \
            --title "STN Android APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Android release build from commit ${GITHUB_SHA}. Flutter static analysis and automated tests passed. Signed with the STN upload key; app ID network.supportivetherapy.app. Install for controlled testing only; this build is not clinical-production approved."
