name: STN API foundation checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-api.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-api.yml"

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run API tests
        run: python -m pytest
