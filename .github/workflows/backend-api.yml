name: STN API foundation checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-api.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-api.yml"

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run API tests
        run: python -m pytest
