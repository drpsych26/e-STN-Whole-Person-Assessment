name: STN verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-static-checks:
    runs-on: ubuntu-latest
    outputs:
      flutter_source_present: ${{ steps.flutter-check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check prototype inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const file = 'prototype/index.html';
          if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
          const html = fs.readFileSync(file, 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script\\s*>/gi)]
            .map(m => m[1].trim()).filter(Boolean);
          if (!scripts.length) throw new Error('No inline JavaScript found');
          scripts.forEach((src, i) => new vm.Script(src, {filename: `${file}:inline-script-${i+1}`}));
          console.log(`PASS: parsed ${scripts.length} inline script(s) in ${file}`);
          NODE
      - name: Check imported HTML source JavaScript when present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(reference/source-html/*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::Original source HTML has not yet been imported to reference/source-html; source fidelity remains unverified."
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const path = require('path');
          const files = fs.readdirSync('reference/source-html').filter(f => f.toLowerCase().endsWith('.html'));
          let count = 0;
          for (const name of files) {
            const file = path.join('reference/source-html', name);
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script\\s*>/gi)]
              .map(m => m[1].trim()).filter(Boolean);
            scripts.forEach((src, i) => new vm.Script(src, {filename: `${file}:inline-script-${i+1}`}));
            count += scripts.length;
            console.log(`PASS: ${file} (${scripts.length} inline script(s))`);
          }
          console.log(`PASS: parsed ${count} imported inline script(s)`);
          NODE
      - name: Detect preserved Flutter v4 source archive
        id: flutter-check
        shell: bash
        run: |
          if [ -s flutter/archive/STN_Diagnostic_Tool_Flutter_MVP_Pack_v4.zip.b64 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Flutter v4 source archive found."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::Flutter v4 source archive is missing."
            exit 1
          fi

  flutter-build-tests:
    needs: prototype-static-checks
    if: needs.prototype-static-checks.outputs.flutter_source_present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original Flutter v4 project and apply reviewed conservative scoring patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flutter/source
          base64 --decode flutter/archive/STN_Diagnostic_Tool_Flutter_MVP_Pack_v4.zip.b64 > /tmp/stn-flutter-v4.zip
          unzip -t /tmp/stn-flutter-v4.zip
          unzip -q /tmp/stn-flutter-v4.zip -d flutter/source
          project=flutter/source/supportive_therapy_network_v4
          test -f "$project/pubspec.yaml"
          mkdir -p "$project/test"
          cp implementation-patches/flutter-v4/lib/logic/scoring_engine.dart "$project/lib/logic/scoring_engine.dart"
          cp implementation-patches/flutter-v4/test/scoring_engine_test.dart "$project/test/scoring_engine_test.dart"
          echo "Restored source project: $project"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - name: Analyze, test, and build Flutter v4
        shell: bash
        run: |
          set -euo pipefail
          cd flutter/source/supportive_therapy_network_v4
          flutter --version
          dart --version
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test --reporter expanded
          flutter build apk --debug
