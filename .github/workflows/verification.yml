name: STN verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-static-checks:
    runs-on: ubuntu-latest
    outputs:
      flutter_source_present: ${{ steps.flutter-check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check prototype inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const file = 'prototype/index.html';
          if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
          const html = fs.readFileSync(file, 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script\s*>/gi)]
            .map(m => m[1].trim()).filter(Boolean);
          if (!scripts.length) throw new Error('No inline JavaScript found');
          scripts.forEach((src, i) => new vm.Script(src, {filename: `${file}:inline-script-${i+1}`}));
          console.log(`PASS: parsed ${scripts.length} inline script(s) in ${file}`);
          NODE
      - name: Run browser prototype workflow regression tests with synthetic data
        run: node tests/prototype-smoke.test.js
      - name: Run follow-up assessment regression tests with synthetic data
        run: node tests/followup-smoke.test.js
      - name: Check imported HTML source JavaScript when present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(reference/source-html/*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::Original source HTML has not yet been imported to reference/source-html; source fidelity remains unverified."
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const path = require('path');
          const files = fs.readdirSync('reference/source-html').filter(f => f.toLowerCase().endsWith('.html'));
          let count = 0;
          for (const name of files) {
            const file = path.join('reference/source-html', name);
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script\s*>/gi)]
              .map(m => m[1].trim()).filter(Boolean);
            scripts.forEach((src, i) => new vm.Script(src, {filename: `${file}:inline-script-${i+1}`}));
            count += scripts.length;
            console.log(`PASS: ${file} (${scripts.length} inline script(s))`);
          }
          console.log(`PASS: parsed ${count} imported inline script(s)`);
          NODE
      - name: Restore byte-identical Flutter v4 source archive
        shell: bash
        run: |
          set -euo pipefail
          part_dir=flutter/source-archives/parts
          if [ -f "$part_dir/part1.txt" ] && [ -f "$part_dir/part2.txt" ] && [ -f "$part_dir/part4.txt" ]; then
            mkdir -p /tmp/stn-v4 flutter/source
            cat "$part_dir/part1.txt" "$part_dir/part2.txt" "$part_dir/part4.txt" > /tmp/stn-v4/source.b64
            test "$(wc -c < /tmp/stn-v4/source.b64)" -eq 18404
            base64 --decode /tmp/stn-v4/source.b64 > /tmp/stn-v4/source.zip
            echo "4478e3e54131fdb94db943524a7aa00cef9239122e572eaad6d9e0d5ad95261c  /tmp/stn-v4/source.zip" | sha256sum --check
            unzip -q /tmp/stn-v4/source.zip -d flutter/source
            cp implementation-patches/flutter-v4/lib/logic/scoring_engine.dart flutter/source/supportive_therapy_network_v4/lib/logic/scoring_engine.dart
            mkdir -p flutter/source/supportive_therapy_network_v4/test
            cp implementation-patches/flutter-v4/test/scoring_engine_test.dart flutter/source/supportive_therapy_network_v4/test/scoring_engine_test.dart
            python3 implementation-patches/flutter-v4/patch_ui.py
          else
            echo "::error::Original Flutter v4 source archive is missing."
            exit 1
          fi
      - name: Require imported Flutter source
        id: flutter-check
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          projects=(flutter/source/*/pubspec.yaml)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::Flutter source is missing from flutter/source/*/pubspec.yaml. CI is blocked until the original source is imported and reconciled."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          printf 'Found Flutter project: %s\n' "${projects[@]}"

  flutter-build-tests:
    needs: prototype-static-checks
    if: needs.prototype-static-checks.outputs.flutter_source_present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore Flutter v4 source in build job
        shell: bash
        run: |
          set -euo pipefail
          part_dir=flutter/source-archives/parts
          mkdir -p /tmp/stn-v4 flutter/source
          cat "$part_dir/part1.txt" "$part_dir/part2.txt" "$part_dir/part4.txt" > /tmp/stn-v4/source.b64
          test "$(wc -c < /tmp/stn-v4/source.b64)" -eq 18404
          base64 --decode /tmp/stn-v4/source.b64 > /tmp/stn-v4/source.zip
          echo "4478e3e54131fdb94db943524a7aa00cef9239122e572eaad6d9e0d5ad95261c  /tmp/stn-v4/source.zip" | sha256sum --check
          python3 - <<'PY'
          import hashlib
          import zipfile
          archive = "/tmp/stn-v4/source.zip"
          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if not members:
                  raise SystemExit("Flutter archive is empty")
              for member in members:
                  data = source.read(member.filename)  # also verifies member CRC
                  if len(data) != member.file_size:
                      raise SystemExit("Size mismatch: " + member.filename)
                  print("Verified", member.filename, hashlib.sha256(data).hexdigest())
              print("PASS: verified", len(members), "archive members")
          PY
          unzip -q /tmp/stn-v4/source.zip -d flutter/source
          cp implementation-patches/flutter-v4/lib/logic/scoring_engine.dart flutter/source/supportive_therapy_network_v4/lib/logic/scoring_engine.dart
          mkdir -p flutter/source/supportive_therapy_network_v4/test
          cp implementation-patches/flutter-v4/test/scoring_engine_test.dart flutter/source/supportive_therapy_network_v4/test/scoring_engine_test.dart
          python3 implementation-patches/flutter-v4/patch_ui.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true
      - name: Analyze, test, and build each Flutter project
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          projects=(flutter/source/*/pubspec.yaml)
          for pubspec in "${projects[@]}"; do
            project="$(dirname "$pubspec")"
            echo "=== Verifying $project ==="
            cd "$GITHUB_WORKSPACE/$project"
            if [ ! -d android ]; then
              flutter create --platforms=android .
            fi
            patch_root="$GITHUB_WORKSPACE/implementation-patches/flutter-v4"
            cp "$patch_root/lib/main.dart" lib/main.dart
            cp "$patch_root/lib/logic/scoring_engine.dart" lib/logic/scoring_engine.dart
            cp "$patch_root/lib/logic/report_builder.dart" lib/logic/report_builder.dart
            cp "$patch_root/lib/storage/secure_hive.dart" lib/storage/secure_hive.dart
            cp "$patch_root/lib/screens/home_screen.dart" lib/screens/home_screen.dart
            cp "$patch_root/lib/screens/whole_person_initial_assessment_screen.dart" lib/screens/whole_person_initial_assessment_screen.dart
            cp "$patch_root/lib/screens/module_screen.dart" lib/screens/module_screen.dart
            cp "$patch_root/lib/screens/results_screen.dart" lib/screens/results_screen.dart
            cp "$patch_root/lib/screens/profiles_screen.dart" lib/screens/profiles_screen.dart
            cp "$patch_root/lib/screens/result_detail_screen.dart" lib/screens/result_detail_screen.dart
            cp "$patch_root/test/scoring_engine_test.dart" test/scoring_engine_test.dart
            cp "$patch_root/test/whole_person_intake_rules_test.dart" test/whole_person_intake_rules_test.dart
            cp "$patch_root/test/widget_test.dart" test/widget_test.dart
            flutter pub get
            dart format lib test
            dart format --output=none --set-exit-if-changed lib test
            flutter analyze
            flutter test
            flutter build apk --debug
            cd "$GITHUB_WORKSPACE"
          done
      - name: Upload internal debug APK
        uses: actions/upload-artifact@v7
        with:
          name: stn-flutter-v4-debug-${{ github.sha }}
          path: flutter/source/supportive_therapy_network_v4/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
